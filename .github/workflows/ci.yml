name: CI

on:
  push:
    branches:
      - main
      - master
      - testing-and-scaling
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Backend aur Chai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./Backend aur Chai/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
        env:
          NODE_ENV: test
          CORS_ORIGIN: http://localhost
          ACCESS_TOKEN_SECRET: test_access_secret
          ACCESS_TOKEN_EXPIRY: 1d
          REFRESH_TOKEN_SECRET: test_refresh_secret
          REFRESH_TOKEN_EXPIRY: 10d
          REDIS_URL: redis://localhost:6379
          CACHE_DEBUG: "false"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./youtubeFrontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./youtubeFrontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost/api/v1

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t youtube-backend-test "./Backend aur Chai"

      - name: Build frontend Docker image
        run: docker build -t youtube-frontend-test "./youtubeFrontend"

      - name: Validate Docker Compose config
        run: docker compose config